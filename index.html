<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuickCounter</title>

<!-- Universal Stylesheet -->
<link rel="stylesheet" href="universal.css">

<style>
    body {
        background: #ffffff;
        margin: 0;
        font-family: Arial, sans-serif;
    }

    .topbar {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 20px;
    }

    .logo {
        width: 70px;
        height: auto;
    }

    .header {
        font-size: 28px;
        font-weight: bold;
        margin: 0;
        padding: 0;
    }

    .container {
        max-width: 420px;
        margin: 0 auto;
        padding: 20px;
        text-align: center;
    }

    .counter-display {
        font-size: 48px;
        font-weight: bold;
        margin: 30px 0;
    }

    .mf-button {
        background-color: #0078ff;
        color: white;
        border: none;
        padding: 14px 26px;
        font-size: 18px;
        border-radius: 8px;
        cursor: pointer;
        margin: 10px;
    }

    .mf-button:active {
        transform: scale(0.97);
    }
</style>
</head>

<body>

<!-- Left-aligned logo + title with tight spacing -->
<div class="topbar">
    <img src="IMG_1741.jpeg" alt="QuickCounter Logo" class="logo">
    <div class="header">QuickCounter</div>
</div>

<div class="container">

    <div id="counter" class="counter-display">0</div>

    <button class="mf-button" onclick="increment()">Add One</button>
    <button class="mf-button" onclick="reset()">Reset</button>

</div>

<script>
    let count = 0;

    function increment() {
        count++;
        document.getElementById("counter").innerText = count;
    }

    function reset() {
        count = 0;
        document.getElementById("counter").innerText = count;
    }
</script>

</body>
</html>

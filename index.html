<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuickCounter</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 16px;
    padding-bottom: 72px;
    font-family: Arial, sans-serif;
    background: #ffffff;
    color: #000000;
}

.logo {
    width: 70px;
    height: auto;
    display: block;
    margin-bottom: 8px;
}

h1 {
    font-size: 24px;
    font-weight: 700;
    text-align: left;
    margin: 0 0 12px 0;
}

.tagline {
    font-size: 15px;
    line-height: 1.3;
    margin-bottom: 24px;
}

.counter-display {
    font-size: 96px;
    font-weight: 700;
    line-height: 1;
    margin-bottom: 24px;
}

.button-row {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
}

button {
    padding: 8px 12px;
    font-size: 14px;
    font-weight: 600;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}

.action-button {
    background: #007aff;
    color: #ffffff;
}

.secondary-button {
    background: #000000;
    color: #ffffff;
}

.footer {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    background: #ffffff;
    border-top: 1px solid #d1d5db;
    padding: 10px 12px;
}

.buy-button {
    display: block;
    width: 100%;
    text-align: center;
    text-decoration: none;
    background: #000000;
    color: #ffffff;
    padding: 12px;
    border-radius: 8px;
    font-weight: 600;
}
</style>
</head>

<body>

IMG_1741.jpeg

<h1>QuickCounter</h1>

<div class="tagline">
    Count anything quickly and copy the result.
</div>

<div id="counter" class="counter-display">
    0
</div>

<div class="button-row">
    <button class="action-button" onclick="increment()">
        Add One
    </button>

    <button class="action-button" onclick="copyCount()">
        Copy
    </button>

    <button class="secondary-button" onclick="resetCounter()">
        Reset
    </button>
</div>

<script>
let count = 0;

function updateCounter() {
    document.getElementById('counter').textContent = count;
}

function increment() {
    count++;
    updateCounter();
}

function resetCounter() {
    count = 0;
    updateCounter();
}

function copyCount() {
    navigator.clipboard.writeText(count.toString());
}
</script>

<div class="footer">
    payment.html?tool=QuickCounter
        Buy This Tool
    </a>
</div>

</body>
</html>

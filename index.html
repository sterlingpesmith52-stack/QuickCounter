<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quick Counter</title>

    <style>
        :root {
            --bg-light: #ffffff;
            --bg-dark: #111;
            --text-light: #222;
            --text-dark: #eee;
            --panel-light: #ffffff;
            --panel-dark: #1a1a1a;
            --border-light: #ccc;
            --border-dark: #444;
            --button-blue: #0078d4;
            --button-blue-dark: #005a9e;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: system-ui, sans-serif;
            background: var(--bg-light);
            color: var(--text-light);
        }

        body.dark-mode {
            background: var(--bg-dark);
            color: var(--text-dark);
        }

        /* Correct logo sizing — no width constraint */
        .logo {
            height: auto;
            margin: 20px;
            display: block;
        }

        h1 {
            margin: 0 0 0 20px;
            font-size: 28px;
            font-weight: 600;
            text-align: left;
        }

        .container {
            max-width: 600px;
            margin: 20px auto;
            padding: 20px;
            background: var(--panel-light);
            border-radius: 10px;
            border: 1px solid var(--border-light);
        }

        body.dark-mode .container {
            background: var(--panel-dark);
            border: 1px solid var(--border-dark);
        }

        #count {
            font-size: 48px;
            font-weight: 600;
            margin-bottom: 20px;
            text-align: left;
        }

        .button-row {
            display: flex;
            flex-direction: row;
            gap: 10px;
            justify-content: flex-start;
        }

        button {
            display: inline-block;
            width: auto;
            padding: 10px 16px;
            font-size: 16px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            background: var(--button-blue);
            color: white;
        }

        #reset {
            background: #666;
        }

        body.dark-mode button {
            background: var(--button-blue-dark);
        }

        body.dark-mode #reset {
            background: #555;
        }

        .toggle {
            margin-top: 20px;
            text-align: left;
            cursor: pointer;
            font-size: 14px;
            opacity: 0.8;
        }
    </style>
</head>

<body>
    <!-- MicroFoundary Logo -->
    <img src="IMG_1669.jpeg" alt="MicroFoundary Logo" class="logo" />

    <h1>Quick Counter</h1>

    <div class="container">
        <div id="count">0</div>

        <div class="button-row">
            <button id="plus">+1</button>
            <button id="reset">Reset</button>
        </div>

        <div class="toggle" id="toggle">Toggle Dark Mode</div>
    </div>

    <script>
        const countEl = document.getElementById("count");
        let count = 0;

        document.getElementById("plus").addEventListener("click", () => {
            count++;
            countEl.textContent = count;
        });

        document.getElementById("reset").addEventListener("click", () => {
            count = 0;
            countEl.textContent = count;
        });

        document.getElementById("toggle").addEventListener("click", () => {
            document.body.classList.toggle("dark-mode");
        });
    </script>
</body>
</html>

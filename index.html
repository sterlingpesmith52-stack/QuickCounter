
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuickCounter</title>

<!-- Universal Stylesheet -->
<link rel="stylesheet" href="universal.css">

<style>
    body {
        background: #ffffff;
        margin: 0;
        font-family: Arial, sans-serif;
    }

    /* Stacked left‑aligned logo + title */
    .header-block {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        padding: 20px;
    }

    .logo {
        width: 120px;
        height: auto;
        margin-bottom: 8px;
    }

    /* FIXED: MicroFoundary standard title size = 24px */
    .header {
        font-size: 24px;
        font-weight: bold;
        margin: 0;
        padding: 0;
        text-align: left;
    }

    .container {
        max-width: 420px;
        margin: 0 auto;
        padding: 20px;
        padding-bottom: 140px; /* Space above footer */
    }

    /* LEFT‑ALIGNED COUNTER */
    .counter-display {
        font-size: 48px;
        font-weight: bold;
        margin: 20px 0 40px 0;
        text-align: left;
    }

    /* Left‑aligned buttons */
    .button-row {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 18px;
        margin-top: 10px;
    }

    .mf-button {
        background-color: #0078ff;
        color: white;
        border: none;
        padding: 14px 26px;
        font-size: 18px;
        border-radius: 8px;
        cursor: pointer;
    }

    .mf-button:active {
        transform: scale(0.97);
    }

    /* Fixed footer Buy button */
    .footer-buy {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        background: #ffffff;
        padding: 16px 0;
        text-align: center;
        border-top: 1px solid #e0e0e0;
    }

    .footer-buy button {
        background-color: #0078ff;
        color: white;
        border: none;
        padding: 14px 30px;
        font-size: 20px;
        border-radius: 10px;
        cursor: pointer;
    }

    .footer-buy button:active {
        transform: scale(0.97);
    }
</style>
</head>

<body>

<div class="header-block">
    <img src="IMG_1741.jpeg" alt="QuickCounter Logo" class="logo">
    <div class="header">QuickCounter</div>
</div>

<div class="container">

    <div id="counter" class="counter-display">0</div>

    <div class="button-row">
        <button class="mf-button" onclick="increment()">Add One</button>
        <button class="mf-button" onclick="reset()">Reset</button>
    </div>

</div>

<!-- Fixed Footer Buy Button -->
<div class="footer-buy">
    <button onclick="window.location.href='payment.html?tool=QuickCounter'">
        Buy This Tool
    </button>
</div>

<script>
    let count = 0;

    function increment() {
        count++;
        document.getElementById("counter").innerText = count;
    }

    function reset() {
        count = 0;
        document.getElementById("counter").innerText = count;
    }
</script>

</body>
</html>

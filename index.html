<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuickCounter</title>

<link rel="stylesheet" href="universal.css">

<style>
    body {
        background: #ffffff;
        margin: 0;
        font-family: Arial, sans-serif;
    }

    /* Header */
    .header-block {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        padding: 20px;
    }

    .logo {
        width: 120px;
        height: auto;
        margin-bottom: 8px;
    }

    .header {
        font-size: 24px;
        font-weight: bold;
        margin: 0;
        text-align: left;
    }

    .tagline {
        margin-top: 10px;
        font-size: 18px;
        color: #333;
        text-align: left;
    }

    .container {
        max-width: 420px;
        margin: 0 auto;
        padding: 20px;
        padding-bottom: 140px;
    }

    .counter-display {
        font-size: 48px;
        font-weight: bold;
        margin: 30px 0 40px 0;
        text-align: left;
    }

    /* Buttons */
    .button-row {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 16px;
    }

    .primary-buttons {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
    }

    .mf-button {
        background: #0078ff;
        color: #ffffff;
        border: none;
        border-radius: 12px;
        padding: 14px 20px;
        font-size: 18px;
        font-weight: 700;
        cursor: pointer;
    }

    .mf-button-secondary {
        background: #000000;
        color: #ffffff;
        border: none;
        border-radius: 12px;
        padding: 14px 20px;
        font-size: 18px;
        font-weight: 700;
        cursor: pointer;
    }

    .mf-button:active,
    .mf-button-secondary:active,
    .footer-buy button:active {
        transform: scale(0.97);
    }

    /* Footer */
    .footer-buy {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        background: #ffffff;
        padding: 16px 0;
        text-align: center;
        border-top: 1px solid #e0e0e0;
    }

    .footer-buy button {
        background-color: #0078ff;
        color: white;
        border: none;
        padding: 14px 30px;
        font-size: 20px;
        border-radius: 12px;
        cursor: pointer;
    }
</style>
</head>

<body>

<div class="header-block">
    IMG_1741.jpeg
    <div class="header">QuickCounter</div>
    <div class="tagline">
        Count anything quickly and copy the result.
    </div>
</div>

<div class="container">

    <div id="counter" class="counter-display">0</div>

    <div class="button-row">

        <div class="primary-buttons">
            <button class="mf-button" onclick="increment()">
                Add One
            </button>

            <button class="mf-button" onclick="copyCount()">
                Copy
            </button>
        </div>

        <button class="mf-button-secondary" onclick="resetCounter()">
            Reset
        </button>

    </div>

</div>

<div class="footer-buy">
    <button onclick="window.location.href='payment.html?tool=QuickCounter'">
        Buy This Tool
    </button>
</div>

<script>
let count = 0;

function updateDisplay() {
    document.getElementById("counter").innerText = count;
}

function increment() {
    count++;
    updateDisplay();
}

function resetCounter() {
    count = 0;
    updateDisplay();
}

function copyCount() {
    navigator.clipboard.writeText(count.toString());
}
</script>

</body>
</html>
